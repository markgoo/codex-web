# codex-web behind nginx with HTTP basic auth.
#
# codex-web itself has no authentication of any kind: anyone who can reach its
# port gets the same power the server process has (run commands, read files, use
# the signed-in Codex account). So it stays on loopback, and this file is the
# only door to the LAN.
#
# Why HTTPS and not plain :8080 — the app runs in a browser here, and a LAN
# origin over http:// is *not* a secure context, so window.crypto.randomUUID is
# undefined and the bundle dies with "crypto.randomUUID is not a function"
# before rendering anything. TLS also keeps the basic-auth password off the wire.
#
# Windows:   copy next to nginx.exe as conf/nginx.conf  (or `include` it)
#            deploy/nginx.ps1 does that copy and reloads.
# Linux/WSL: /etc/nginx/conf.d/codex-web.conf  (drop worker_processes/events/http
#            if you already have them in nginx.conf)
#
# Before starting nginx:
#   1. certs: openssl req -x509 -nodes -days 825 -newkey rsa:2048 \
#        -keyout deploy/certs/codex-web.key -out deploy/certs/codex-web.crt \
#        -subj "/CN=codex-web" -addext "subjectAltName=IP:<lan-ip>,IP:127.0.0.1,DNS:localhost"
#   2. deploy/nginx.ps1 substitutes @REPO@ with this checkout's path while it
#      installs this file, so no path is hard-coded here.

worker_processes 1;

error_log logs/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # WebSocket upgrade passthrough for /__backend/ipc.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream codex_web {
        server 127.0.0.1:8214;
    }

    # Plain HTTP is only a signpost: same host, TLS port.
    server {
        listen      8080;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }

    server {
        # LAN-facing. Use a different port if 8443 is taken; bind a specific
        # address (e.g. 192.168.1.10:8443) to keep it off other interfaces.
        listen              8443 ssl;
        server_name         _;

        ssl_certificate     @REPO@/deploy/certs/codex-web.crt;
        ssl_certificate_key @REPO@/deploy/certs/codex-web.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # --- the login ---
        auth_basic           "codex-web";
        auth_basic_user_file @REPO@/deploy/htpasswd;

        # Agent turns and tool calls can idle for a long time before output.
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;

        # File/image uploads go through the app's own upload endpoint.
        client_max_body_size 0;

        location / {
            proxy_pass http://codex_web;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket (the app builds its URL from window.location, so this is
            # the only place the upgrade needs handling).
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Credentials are for nginx only. Don't hand them to the app, which
            # would otherwise forward them to whatever it proxies upstream.
            proxy_set_header Authorization "";
        }
    }
}
